<style>
  :root{--dy:#E6EE7A;--cream:#fefcd0;--ink:#000;--line:#ddea65;--red:#e23b3b;
    --serif:"adobe-caslon-pro",Georgia,serif;
    --sans:"neue-haas-grotesk-text",'Pretendard','Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);letter-spacing:-.02em;color:var(--ink);line-height:1.7;
    background:linear-gradient(180deg,var(--cream) 0%,#fff 62%) fixed;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .gate{width:100%;max-width:430px;text-align:center}
  .wm{height:30px;width:auto;display:block;margin:0 auto 2.6rem}
  h1{font-family:var(--serif);font-weight:600;font-size:1.85rem;line-height:1.25;margin-bottom:.9rem}
  p.sub{font-size:.95rem;color:rgba(0,0,0,.65);margin-bottom:2rem}
  form{border-top:2px solid var(--ink);padding-top:1.6rem;text-align:left}
  label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem}
  .row{display:flex;gap:.55rem}
  input{flex:1;min-width:0;font-family:var(--sans);font-size:1rem;letter-spacing:-.02em;
    padding:.7em .9em;border:2px solid var(--ink);border-radius:11px;background:#fff;color:var(--ink)}
  input:focus{outline:none;box-shadow:0 0 0 4px rgba(230,238,122,.65)}
  button{font-family:var(--sans);font-weight:700;font-size:.95rem;letter-spacing:-.02em;
    background:var(--ink);color:var(--dy);border:none;border-radius:999px;padding:.7em 1.5em;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.45;cursor:default}
  .msg{min-height:1.5rem;margin-top:.9rem;font-size:.9rem;font-weight:700;color:var(--red)}
  .msg.work{color:rgba(0,0,0,.55)}
  .conf{display:inline-block;border:2px solid var(--ink);border-radius:999px;background:var(--dy);
    padding:.34em 1.05em;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    margin-bottom:1.9rem}
  .notice{margin-top:1.9rem;padding:.95rem 1.1rem;border-left:6px solid var(--ink);
    background:rgba(255,255,255,.6);font-size:.8rem;color:rgba(0,0,0,.62);line-height:1.6;text-align:left}
  .notice strong{color:var(--ink)}
  .foot{margin-top:1.5rem;font-size:.82rem;color:rgba(0,0,0,.5)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  .shake{animation:shake .35s}
</style>

<div class="gate">
  <span class="conf">기밀 · 관계자 외 열람 금지</span>
  <img class="wm" src="assets/lemonderma-logo.png" alt="Lemonderma">
  <h1>유통 파트너 전용</h1>
  <p class="sub">이 자료는 레몬더마 유통 파트너에게만 공개됩니다.<br>전달받은 비밀번호를 입력해 주십시오.</p>
  <form id="f" autocomplete="off">
    <label for="pw">비밀번호</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button id="go" type="submit">열기</button>
    </div>
    <div class="msg" id="m"></div>
  </form>
  <div class="notice"><strong>본 문서는 주식회사 비디비아(VDVIA Inc.)의 자산입니다.</strong> LEMONDERMA의 공식 유통 파트너 및 그 업무 담당자에게만 제공되며, <strong>관계자 외 열람을 금지합니다.</strong> 본사의 사전 서면 동의 없이 제3자에게 열람·복제·배포·전송하거나 본 문서의 링크를 공유하는 것을 금합니다.</div>
